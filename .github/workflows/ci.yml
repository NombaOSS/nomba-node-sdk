name: CI

on:
  push:
    branches-ignore: [main] # release.yml runs CI on main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run lint:architecture
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/
          retention-days: 1

  smoke:
    name: smoke (${{ matrix.node-version }})
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci --ignore-scripts
      - if: matrix.node-version != 22
        run: npm test
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: Unpack the packed package into an empty app
        run: |
          mkdir "$RUNNER_TEMP/app"
          cp scripts/smoke/* "$RUNNER_TEMP/app/"
          mkdir -p "$RUNNER_TEMP/app/node_modules/@nomba/node-sdk"
          tar -xzf "$RUNNER_TEMP"/package/nomba-node-sdk-*.tgz -C "$RUNNER_TEMP/app/node_modules/@nomba/node-sdk" --strip-components=1
      - name: Import with ESM and CommonJS
        working-directory: ${{ runner.temp }}/app
        run: |
          node smoke.mjs
          node smoke.cjs
      - name: Type-check against the published typings
        run: node_modules/.bin/tsc -p "$RUNNER_TEMP/app" --typeRoots "$GITHUB_WORKSPACE/node_modules/@types"
